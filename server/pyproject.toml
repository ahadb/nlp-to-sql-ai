[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-sql-api"
version = "1.0.0"
description = "NLP to SQL API"
requires-python = ">=3.12.6"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "psycopg2-binary==2.9.9",
    "openai==0.28.1",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.0",
]